<article class="assoc-card card">
    <a href="{{ association.get_absolute_url }}" class="assoc-cover" tabindex="-1" aria-hidden="true">
        {% if association.image %}<img src="{{ association.image.url }}" alt="" loading="lazy">
        {% else %}<span class="assoc-cover-fallback">{{ association.name|slice:":1"|upper }}</span>{% endif %}
    </a>
    <div class="assoc-card-body">
        <div class="row between">
            <span class="chip chip-static"><span class="cat-dot cat-{{ association.category|lower }}"></span>{{ association.category_label }}</span>
            <span class="badge badge-{{ association.status }}">{{ association.get_status_display }}</span>
        </div>
        <h3><a href="{{ association.get_absolute_url }}">{{ association.name }}</a></h3>
        <p class="muted">{{ association.description|truncatechars:110 }}</p>
        <div class="row">
            <a class="btn btn-sm btn-secondary" href="{{ association.get_absolute_url }}">View page</a>
            <a class="btn btn-sm btn-ghost" href="{% if association.type == 'clubs' %}{% url 'club_member' association.pk %}{% else %}{% url 'committee_member' association.pk %}{% endif %}"><i class="fa-solid fa-users"></i>Members</a>
        </div>
    </div>
</article>
